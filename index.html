<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pin Button Layout Designer</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="app-header" data-testid="app-header">
        <div class="header-content">
          <h1 class="app-title">Pin Button Layout Designer</h1>

          <div class="header-controls">
            <!-- Session Controls -->
            <div class="session-controls">
              <button id="new-session-btn" class="btn btn-secondary">New</button>
              <button id="save-session-btn" class="btn btn-secondary" data-testid="save-session">Save</button>
              <select id="session-select" class="session-select">
                <option value="">Load Session...</option>
              </select>
              <span id="session-indicator" class="session-indicator" data-testid="session-indicator">Temporary Session</span>
            </div>

            <!-- Print Controls -->
            <div id="print-container" class="print-controls">
              <!-- Print button will be inserted here by PrintButtonComponent -->
            </div>
          </div>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Toolbar -->
        <div class="toolbar" data-testid="toolbar">
          <div class="tool-group">
            <button id="auto-arrange-btn" class="tool-btn" title="Auto-arrange buttons">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 3h18v2H3V3zm0 4h18v2H3V7zm0 4h18v2H3v-2zm0 4h18v2H3v-2z"/>
              </svg>
              Auto-arrange
            </button>

            <button id="clear-all-btn" class="tool-btn" title="Clear all buttons">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
              </svg>
              Clear all
            </button>
          </div>

          <div class="tool-group">
            <div class="zoom-controls">
              <button id="zoom-out-btn" class="tool-btn">−</button>
              <span id="zoom-display" class="zoom-display">100%</span>
              <button id="zoom-in-btn" class="tool-btn">+</button>
            </div>
          </div>

          <div class="tool-group">
            <div class="page-info" data-testid="page-info">
              <span class="page-size">Letter (8.5" × 11")</span>
              <span id="button-count" class="button-count">0 buttons</span>
            </div>
          </div>
        </div>

        <!-- Canvas Container -->
        <div class="canvas-wrapper">
          <div id="canvas-container" class="canvas-container" data-testid="canvas-container">
            <!-- Canvas component will be inserted here -->
          </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
          <div class="status-left">
            <span id="status-message" class="status-message">Ready</span>
          </div>
          <div class="status-right">
            <span id="performance-info" class="performance-info"></span>
          </div>
        </div>
      </main>

      <!-- Loading Overlay -->
      <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-content">
          <div class="loading-spinner"></div>
          <div class="loading-message">Loading...</div>
        </div>
      </div>

      <!-- Error Messages Container -->
      <div id="error-container" class="error-container" data-testid="error-message" style="display: none;">
        <!-- Dynamic error messages will appear here -->
      </div>

      <!-- Help Tooltip Container -->
      <div id="tooltip-container" class="tooltip-container">
        <!-- Dynamic tooltips will appear here -->
      </div>
    </div>

    <!-- Application Script -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
